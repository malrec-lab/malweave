site_name: MalWeave
site_description: Independent research documentation for malware language modeling.
site_author: MalWeave contributors
theme:
  name: readthedocs
plugins:
  - search
  - mermaid2:
      version: "10.4.0"
      arguments:
        theme: base
        themeVariables:
          fontSize: 20px
        flowchart:
          htmlLabels: true
          nodeSpacing: 52
          rankSpacing: 72
          useMaxWidth: true
          wrappingWidth: 250
nav:
  - Home: index.md
  - Getting started:
      - Environment setup: getting-started.md
      - Onboarding a research task: onboarding.md
  - Workflows:
      - LMLM on RanDS: workflows/lmlm-rands.md
      - LMLM on RanDS protocol: workflows/lmlm-rands-protocol.md
      - LMLM on RanDS architecture: workflows/lmlm-rands-architecture.md
      - Research workstreams: workflows/research-workstreams.md
      - Distributed Ghidra extraction: workflows/distributed-ghidra.md
      - Distributed Ghidra quick start: workflows/distributed-ghidra-quickstart.md
  - Development:
      - Environment and dependencies: development/environment.md
  - Project structure: project-structure.md
  - Migration report: migration.md
  - Dataset catalog:
      - Overview: datasets/index.md
      - Assemblage: datasets/assemblage.md
      - BODMAS: datasets/bodmas.md
      - RanDS: datasets/rands.md
      - SOREL-20M: datasets/sorel-20m.md
