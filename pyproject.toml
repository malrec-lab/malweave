[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "malweave"
version = "0.1.0"
description = "Independent research tooling for malware language modeling."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "MalWeave contributors" }]
dependencies = [
    "lief==0.15.1",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "unidecode>=1.3,<2",
]

[project.scripts]
malweave = "malweave.cli:main"

[dependency-groups]
test = ["pytest>=8.0,<9"]
lint = ["ruff>=0.8,<1"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-mermaid2-plugin>=1.2.3",
]
train = [
    "boto3>=1.35,<2",
    "scikit-learn>=1.5,<2",
    "safetensors>=0.4,<0.9",
    "tokenizers>=0.20,<0.22",
    "torch>=2.2,<2.7",
    "transformers>=4.46,<4.48",
]
# Native wheels target the validated Python/Torch ABI; installed only on the GPU worker.
gpu = [
    { include-group = "train" },
    "torch==2.6.0",
    "mamba-ssm @ https://github.com/state-spaces/mamba/releases/download/v2.2.4/mamba_ssm-2.2.4+cu12torch2.6cxx11abiFALSE-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "causal-conv1d @ https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.5.0.post8/causal_conv1d-1.5.0.post8+cu12torch2.6cxx11abiFALSE-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "train" },
]

[tool.setuptools.packages.find]
include = ["malweave*"]

[tool.ruff]
line-length = 99
target-version = "py310"
src = ["malweave", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["malweave"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.11.9"
default-groups = ["dev"]
