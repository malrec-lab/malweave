[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "malweave"
version = "0.1.0"
description = "Independent research tooling for malware language modeling."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "MalWeave contributors" }]
dependencies = [
    "lief==0.15.1",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "unidecode>=1.3,<2",
]

[project.scripts]
malweave = "malweave.cli:main"

[dependency-groups]
test = ["pytest>=8.0,<9"]
lint = ["ruff>=0.8,<1"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-mermaid2-plugin>=1.2.3",
]
train = [
    "tokenizers>=0.20,<0.22",
    "torch>=2.2,<2.7",
    "transformers>=4.46,<4.48",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "train" },
]

[tool.setuptools.packages.find]
include = ["malweave*"]

[tool.ruff]
line-length = 99
target-version = "py310"
src = ["malweave", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["malweave"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.11.9"
default-groups = ["dev"]
