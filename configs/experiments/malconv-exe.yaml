# MalConvGCT on statically extracted executable-section bytes.
# Independently selected from EXE S3 objects and shared RanDS label metadata.
experiment:
  name: rands-malconv-exe
  dataset: rands
  kind: feasibility
  seed: 42

references:
  rands_snapshot: "2026-09-02"

data:
  representation: exe
  dataset_config: configs/datasets/rands-raw-2026.yaml
  bucket_env: MALWEAVE_RANDS_S3_BUCKET
  exe_prefix: rands/representations/exe/
  metadata_filters: {arch: I386, packed: false}
  source_policy:
    deduplicate_by: source_sha256
    exclude_conflicting_labels: true
    verify_sha256: true
  # Derived manifests produced by `prepare-rands-exe` and consumed by training.
  manifest_presets:
    full:
      manifest: data/processed/rands/exe-s3/exe-train-balanced-full-independent.csv
      summary: reports/rands/exe-s3/exe-train-balanced-full-independent.json
      staging_name: full-train-balanced-independent
    pilot:
      total: 1000
      manifest: data/processed/rands/exe-s3/exe-train-balanced-pilot-independent.csv
      summary: reports/rands/exe-s3/exe-train-balanced-pilot-independent.json
      staging_name: pilot-independent
  exe_manifest:
    metadata_prefix: RanDS_PE_Dataset/
    metadata_cache: data/processed/rands/exe-s3/rands-metadata
    metadata_key: rands/representations/exe/manifest.csv
    state_root: data/processed/rands/exe-s3/metadata-independent
    balance_splits: [train]
    unavailable_policy: report_and_exclude
    same_split_duplicate_policy: retain
    cross_split_duplicate_policy: fail
    cross_label_duplicate_policy: fail
  selection_method: sha256_rank_per_label_within_split
  selection_seed: rands-raw-experiment-v1
  labels: {benign: 0, ransomware: 1}

split:
  group_key: source_sha256
  active_representation_group_key: representation_sha256
  method: temporal_by_year
  time_field: Year
  year_ranges:
    train: {max: 2022}
    validation: {min: 2023, max: 2023}
    test: {min: 2024}
  fractions: {train: 0.70, validation: 0.15, test: 0.15}
  on_class_shortfall: fail

inputs:
  exe:
    truncation: {max_bytes: 1048576, side: right}
    encoding: {byte_id_offset: 1, pad_token_id: 0, vocab_size: 257}

runtime:
  device: cuda:0
  batch_size: 1
  gradient_accumulation_steps: 64

tracks:
  malconvgct:
    representation: exe
    architecture:
      vocab_size: 257
      embedding_size: 8
      channels: 256
      stride: 64
      kernel_size: 256
      layers: 1
      pad_token_id: 0
      num_labels: 2
      chunk_size: 65536
      min_chunk_size: 1024
    training:
      epochs: 1
      precision: fp32
      optimizer: {learning_rate: 0.001, weight_decay: 0.01}
      scheduler: {warmup_ratio: 0.05, max_grad_norm: 1.0}
