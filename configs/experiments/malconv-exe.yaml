# MalConvGCT on statically extracted executable-section bytes.
# The source inventory and temporal cohort policy intentionally match malconv-raw.yaml.
experiment:
  name: rands-malconv-exe
  dataset: rands
  kind: feasibility
  seed: 42

references:
  rands_snapshot: "2026-09-02"
  source_experiment: configs/experiments/malconv-raw.yaml

data:
  bucket_env: MALWEAVE_RANDS_S3_BUCKET
  # Inventory validates source availability and freezes the RAW baseline identities/splits.
  # EXE preparation downloads bytes from exe_prefix below.
  raw_prefix: RanDS_PE_Dataset/dataset/
  exe_prefix: rands/representations/exe/
  inventory:
    metadata_prefix: RanDS_PE_Dataset/
    metadata_cache: data/processed/rands/raw-s3/metadata
    state_db: data/processed/rands/raw-s3/inventory.sqlite
    protocol: lmlm_x86_unpacked
  metadata_filters: {arch: I386, packed: false}
  source_policy:
    deduplicate_by: source_sha256
    exclude_conflicting_labels: true
    verify_sha256: true
  manifest_inputs:
    inventory: data/processed/rands/raw-s3/raw-metadata-candidates.csv
    inventory_summary: reports/rands/raw-s3/inventory.json

  # Frozen RAW source cohorts. EXE extraction inherits their rows and splits.
  source_manifest_presets:
    full:
      manifest: data/processed/rands/raw-s3/raw-all-available-split.csv
      summary: reports/rands/raw-s3/raw-all-available-split.json
    pilot:
      total: 1000
      balanced: true
      manifest: data/processed/rands/raw-s3/raw-pilot-1000.csv
      summary: reports/rands/raw-s3/raw-pilot-1000.json

  # Derived manifests produced by `prepare-rands-exe` and consumed by training.
  manifest_presets:
    full:
      manifest: data/processed/rands/exe-s3/exe-all-available-split.csv
      summary: reports/rands/exe-s3/exe-all-available-split.json
    pilot:
      manifest: data/processed/rands/exe-s3/exe-pilot-1000-v2.csv
      summary: reports/rands/exe-s3/exe-pilot-1000-v2.json
  extraction:
    representation_root: data/processed/rands/exe-s3/representations
    state_root: data/processed/rands/exe-s3/state
    method: staged_s3_exe_bytes
    max_object_bytes: 2147483648
    inherit_source_split: true
    on_failure: report_and_exclude_from_paired_cohort
    duplicate_group_key: representation_sha256
    cross_label_duplicate_policy: fail
  selection_method: sha256_rank_per_label_within_split
  selection_seed: rands-raw-experiment-v1
  labels: {benign: 0, ransomware: 1}

split:
  group_key: source_sha256
  active_representation_group_key: representation_sha256
  method: temporal_by_year
  time_field: Year
  year_ranges:
    train: {max: 2022}
    validation: {min: 2023, max: 2023}
    test: {min: 2024}
  fractions: {train: 0.70, validation: 0.15, test: 0.15}
  on_class_shortfall: fail
  inherit_from_source_manifest: true

inputs:
  exe:
    truncation: {max_bytes: 1048576, side: right}
    encoding: {byte_id_offset: 1, pad_token_id: 0, vocab_size: 257}

runtime:
  device: cuda:0
  batch_size: 1
  gradient_accumulation_steps: 64

tracks:
  malconvgct:
    representation: exe
    architecture:
      vocab_size: 257
      embedding_size: 8
      channels: 256
      stride: 64
      kernel_size: 256
      layers: 1
      pad_token_id: 0
      num_labels: 2
      chunk_size: 65536
      min_chunk_size: 1024
    training:
      epochs: 1
      precision: fp32
      optimizer: {learning_rate: 0.001, weight_decay: 0.01}
      scheduler: {warmup_ratio: 0.05, max_grad_norm: 1.0}
