# Approved metadata round with exact model-input deduplication; no DiE gate.
experiment:
  dataset: rands
  kind: benchmark
  name: lmlm-c-metadata
cohort:
  eligibility: rands_metadata
  arch: I386
  packed: false
  train_years: [2006, 2023]
  validation_years: [2024, 2024]
  test_years: [2025, 2025]
  train_balance: fixed_random_undersampling
  deduplication: exact_model_tokens_after_full_exe
  seed: 0
inputs:
  exe:
    truncation: {max_bytes: 65536, max_tokens: 65536}
    checkpoint_context: 65536
runtime:
  gradient_checkpointing: true
  mamba_fast_path_required: true
finetuning:
  representation: exe
  mode: full
  head: {type: linear, initialization: upstream_normal}
  selection: {checkpoint: validation_roc_auc, threshold: argmax}
  early_stopping: {patience: 3, min_delta: 0}
  bootstrap: {replicates: 2000, confidence: 0.95, seed: 0}
tracks:
  mamba:
    training:
      epochs: 5
      batch_size: 1
      effective_batch_size: 64
      precision: bf16
      optimizer:
        learning_rate: 0.00001
        weight_decay: 0.01
        betas: [0.9, 0.999]
        epsilon: 0.00000001
      scheduler: {type: linear, warmup_ratio: 0.05, max_grad_norm: 1.0}
